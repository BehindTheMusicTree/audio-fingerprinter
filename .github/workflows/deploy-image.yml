name: Deploy AFP image

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      target:
        required: true
        type: string
    secrets:
      coolify-api-token:
        required: true
      server-deploy-username:
        required: true
      server-deploy-ssh-private-key:
        required: true
      discord-webhook-url:
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/behindthemusictree/afp

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate deployment inputs
        id: image-tags
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET" in
            production) moving_tag=prod ;;
            staging) moving_tag=staging ;;
            *) exit 1 ;;
          esac
          printf 'moving_tag=%s\n' "$moving_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Verify source revision
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.image-tags.outputs.moving_tag }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ inputs.target }})
    needs: [build]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger afp deploy
        uses: BehindTheMusicTree/github-workflows/.github/actions/trigger-coolify-deploy@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
        with:
          app_name: afp
          coolify_environment: ${{ inputs.target }}
          coolify_subdomain: ${{ vars.COOLIFY_API_SUBDOMAIN }}
          domain: ${{ vars.DOMAIN_NAME }}
          coolify_api_token: ${{ secrets.coolify-api-token }}
          server_host: ${{ vars.DEPLOY_SSH_HOST }}
          server_deploy_username: ${{ secrets.server-deploy-username }}
          server_deploy_ssh_private_key: ${{ secrets.server-deploy-ssh-private-key }}
          discord_webhook_url: ${{ secrets.discord-webhook-url }}
          health_check_path: /health
          health_check_origin_ip: ${{ vars.APP_ORIGIN_IP }}
