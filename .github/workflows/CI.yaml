name: CI

on:
  push:
    branches: [main, dev]

jobs:
  Tests:
    runs-on: ubuntu-22.04
    env:
      ENV: "GITHUB_CI"

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg=7:4.4.2-0ubuntu0.22.04.1

      - name: Add right fpcalc to PATH
        run: |
          cp ${{ github.workspace }}/env/fpcalc/fpcalc-ubuntu ${{ github.workspace }}/bin/fpcalc
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Set env variables file
        run: |
          cp ${{ github.workspace }}/env/variables/github-ci/.env ${{ github.workspace }}/.env
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Run tests
        run: python -m unittest discover

  Build-and-Push-to-DockerHub:
    needs: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ secrets.DOCKER_TAG }}

  Call-Webhook:
    needs: Build-and-Push-to-DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Call webhook
        uses: distributhor/workflow-webhook@v1
        env:
          webhook_type: "json-extended"
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
