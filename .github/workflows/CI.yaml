name: Audio Fingerprinter CI

on:
  push:
    branches: [main, dev, improve-deployment]
  pull_request:
    branches: [main, dev, improve-deployment]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    environment:
      name: CI_TEST
    env:
      APP_IS_DOCKERIZED: false
      APP_IS_EXPOSED: false
      POOL_DIR_INTERNAL: ${{ vars.POOL_DIR_INTERNAL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
           python-version: 3.12

      - name: Cache apt packages
        uses: actions/cache@v2
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('scripts/install_dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-
  
      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies & python requirements
        run: |
          sudo -E bash scripts/install_dependencies.sh
          python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Set up filesystem
        run: bash scripts/setup_filesystem.sh

      - name: Run tests
        env:
          FPCALC: ${{ vars.FPCALC_INTERNAL_PATH }}
          ENV: ${{ vars.ENV }}
          DEBUG: true
          APP_PORT: ${{ vars.APP_PORT }}
        run: python -m unittest discover

  build-and-push-to-dockerhub:
    name: Build / Push to DockerHub
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.AFP_IMAGE_REPO }}:${{ vars.APP_VERSION }}
          build-args: |
            FPCALC_INTERNAL_PATH=${{ vars.FPCALC_INTERNAL_PATH }}
            POOL_DIR_EXTERNAL=${{ vars.AFP_POOL_DIR_EXTERNAL }}
            FLASK_LOG_DIR_EXTERNAL=${{ vars.AFP_FLASK_LOG_DIR_EXTERNAL }}
            FLASK_LOG_APP_FILENAME=${{ vars.FLASK_LOG_APP_FILENAME }}
            FLASK_LOG_ERROR_FILENAME=${{ vars.FLASK_LOG_ERROR_FILENAME }}
            FLASK_LOG_REQUESTS_FILENAME=${{ vars.FLASK_LOG_REQUESTS_FILENAME }}
            GUNICORN_LOG_DIR=${{ vars.AFP_GUNICORN_LOG_DIR_EXTERNAL }}
            GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
            GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }}

  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [build-and-push-to-dockerhub]
    uses: Bodzify/bodzify-server-management/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: TEST
    secrets: inherit
