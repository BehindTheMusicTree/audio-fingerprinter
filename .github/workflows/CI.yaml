name: Audio Fingerprinter CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  IMAGE_REPO: ${{ vars.AUDIO_FINGERPRINTER_IMAGE_REPO }}
  IMAGE_TAG: ${{ vars.IMAGE_TAG }}
  SSH_DESTINATION: ${{ secrets.TEST_SERVER_SSH_BODZIFY_USERNAME }}@${{ vars.TEST_SERVER_URL }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL }}
  ENV_VARIABLES_FILENAME: ${{ vars.ENV_VARIABLES_FILENAME }}

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    environment:
      name: CI_TEST
    env:
      ENV: CI_TEST
      APP_PORT: ${{ secrets.APP_PORT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg=7:4.4.2-0ubuntu0.22.04.1

      - name: Add right fpcalc to PATH
        run: |
          cp ${{ github.workspace }}/env/fpcalc/fpcalc-ubuntu ${{ github.workspace }}/bin/fpcalc
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Set up filesystem
        run: bash ${{ github.workspace }}/scripts/filesystem_setup.ci_test.sh

      - name: Run tests
        run: python -m unittest discover

  build-and-push-to-dockerhub:
    name: Build / Push to DockerHub
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: TEST

    steps:
      - uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}


  set-env-variables-on-server:
    name: Set environment variables on server
    needs: build-and-push-to-dockerhub
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_CI_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ env.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and POSTGRES_PORT env variables are required by the postgres image
      - name: Set environment variables on server
        run: |
          ENV_FILE_PATH="${{ vars.DOCKER_COMPOSE_DIR }}${{ env.ENV_VARIABLES_FILENAME }}"
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f $ENV_FILE_PATH &&
            echo 'ENV=TEST' >> $ENV_FILE_PATH &&
            echo 'APP_PORT=${{ secrets.APP_PORT }}' >> $ENV_FILE_PATH
          "

  set-partial-docker-compose-on-server:
    name: Set partial docker-compose on server
    runs-on: ubuntu-latest
    needs: [build-and-push-to-dockerhub]
    environment: 
      name: TEST
    env:
      DOCKER_COMPOSE_PART_FILENAME: ${{ vars.DOCKER_COMPOSE_PART_FILENAME }}
      APP_PORT: ${{ secrets.APP_PORT }}

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_CI_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ env.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      - name: Generate partial docker compose file
        env:
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
        run: |
          bash ${{ github.workspace }}/scripts/generate_docker_compose_part.sh

      - name: Transfer partial docker-compose on server
        run: |
          scp ${{ github.workspace }}/scripts/${{ env.DOCKER_COMPOSE_PART_FILENAME }} ${{ env.SSH_DESTINATION }}:\
          ${{ vars.DOCKER_COMPOSE_DIR }}${{ vars.DOCKER_COMPOSE_PARTS_DIR_NAME }}/${{ env.DOCKER_COMPOSE_PART_FILENAME }}

  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [set-env-variables-on-server, set-partial-docker-compose-on-server]
    uses: Bodzify/bodzify-redeploy-webhook-action/.github/workflows/workflow.yml@main
    with:
      env: TEST
    secrets: inherit
