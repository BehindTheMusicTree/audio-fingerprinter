name: CI

on:
  push:
    branches: [main, dev]

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    env:
      ENV: GITHUB_CI_TEST
      PORT: 5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg=7:4.4.2-0ubuntu0.22.04.1

      - name: Add right fpcalc to PATH
        run: |
          cp ${{ github.workspace }}/env/fpcalc/fpcalc-ubuntu ${{ github.workspace }}/bin/fpcalc
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Set up filesystem
        run: bash ${{ github.workspace }}/scripts/setup_filesystem_github_ci_test.sh

      - name: Run tests
        run: python -m unittest discover

  build-and-push-to-dockerhub:
    name: Build / Push to DockerHub
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_REPO }}:${{ vars.IMAGE_TAG }}
          build-args: |
            port=${{ secrets.TEST_APP_PORT }}

  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [build-and-push-to-dockerhub]
    uses: Bodzify/bodzify-redeploy-webhook-action/.github/workflows/workflow.yml@main
    with:
      env: TEST
    secrets: inherit
