name: Audio Fingerprinter CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    env:
      ENV: GITHUB_CI_TEST
      APP_PORT: 5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg=7:4.4.2-0ubuntu0.22.04.1

      - name: Add right fpcalc to PATH
        run: |
          cp ${{ github.workspace }}/env/fpcalc/fpcalc-ubuntu ${{ github.workspace }}/bin/fpcalc
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Set up filesystem
        run: bash ${{ github.workspace }}/scripts/setup_filesystem.github_ci_test.sh

      - name: Run tests
        run: python -m unittest discover

  build-and-push-to-dockerhub:
    name: Build / Push to DockerHub
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.AUDIO_FINGERPRINTER_IMAGE_REPO }}:${{ vars.AUDIO_FINGERPRINTER_IMAGE_TAG }}


  set-env-variables-on-server:
    name: Set environment variables on server
    runs-on: ubuntu-latest
    needs: [build-and-push-to-dockerhub]
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_CI_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and POSTGRES_PORT env variables are required by the postgres image
      - name: Set environment variables on server
        run: |
          ENV_FILE_PATH="${{ vars.DOCKER_COMPOSE_DIR }}${{ vars.AUDIO_FINGERPRINTER_ENV_VARIABLES_FILENAME }}"
          ssh ${{ secrets.TEST_SERVER_SSH_BODZIFY_USERNAME }}@${{ vars.TEST_SERVER_URL }} "
            rm -f $ENV_FILE_PATH &&
            echo 'ENV=TEST' >> $ENV_FILE_PATH &&
            echo 'APP_PORT=${{ secrets.TEST_APP_PORT }}' >> $ENV_FILE_PATH
          "

  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [set-env-variables-on-server]
    uses: Bodzify/bodzify-redeploy-webhook-action/.github/workflows/workflow.yml@main
    with:
      env: TEST
    secrets: inherit
