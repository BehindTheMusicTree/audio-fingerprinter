name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push-to-dockerhub:
    name: Build / Push to DockerHub
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - uses: actions/checkout@v4

      - name: Validate required vars
        env:
          FPCALC_INTERNAL_PATH: ${{ vars.FPCALC_INTERNAL_PATH }}
          FLASK_LOG_APP_FILENAME: ${{ vars.FLASK_LOG_APP_FILENAME }}
          FLASK_LOG_ERROR_FILENAME: ${{ vars.FLASK_LOG_ERROR_FILENAME }}
          FLASK_LOG_REQUESTS_FILENAME: ${{ vars.FLASK_LOG_REQUESTS_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
        run: bash scripts/check-publish-env.sh FPCALC_INTERNAL_PATH FLASK_LOG_APP_FILENAME FLASK_LOG_ERROR_FILENAME FLASK_LOG_REQUESTS_FILENAME GUNICORN_LOG_ACCESS_FILENAME GUNICORN_LOG_ERROR_FILENAME DOCKERHUB_USERNAME AFP_IMAGE_REPO

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.AFP_IMAGE_REPO }}:${{ github.ref_name }}
          build-args: |
            FPCALC_INTERNAL_PATH=${{ vars.FPCALC_INTERNAL_PATH }}
            FLASK_LOG_APP_FILENAME=${{ vars.FLASK_LOG_APP_FILENAME }}
            FLASK_LOG_ERROR_FILENAME=${{ vars.FLASK_LOG_ERROR_FILENAME }}
            FLASK_LOG_REQUESTS_FILENAME=${{ vars.FLASK_LOG_REQUESTS_FILENAME }}
            GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
            GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
