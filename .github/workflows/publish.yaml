name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-to-ghcr:
    name: Build / Push to GHCR
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - uses: actions/checkout@v4

      - name: Validate required vars
        env:
          FPCALC_INTERNAL_PATH: ${{ vars.FPCALC_INTERNAL_PATH }}
          FLASK_LOG_APP_FILENAME: ${{ vars.FLASK_LOG_APP_FILENAME }}
          FLASK_LOG_ERROR_FILENAME: ${{ vars.FLASK_LOG_ERROR_FILENAME }}
          FLASK_LOG_REQUESTS_FILENAME: ${{ vars.FLASK_LOG_REQUESTS_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          GHCR_IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
        run: bash scripts/check-publish-env.sh FPCALC_INTERNAL_PATH FLASK_LOG_APP_FILENAME FLASK_LOG_ERROR_FILENAME FLASK_LOG_REQUESTS_FILENAME GUNICORN_LOG_ACCESS_FILENAME GUNICORN_LOG_ERROR_FILENAME GHCR_IMAGE_NAMESPACE AFP_IMAGE_REPO

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ vars.GHCR_IMAGE_NAMESPACE }}/${{ vars.AFP_IMAGE_REPO }}:${{ github.ref_name }}
          build-args: |
            FPCALC_INTERNAL_PATH=${{ vars.FPCALC_INTERNAL_PATH }}
            FLASK_LOG_APP_FILENAME=${{ vars.FLASK_LOG_APP_FILENAME }}
            FLASK_LOG_ERROR_FILENAME=${{ vars.FLASK_LOG_ERROR_FILENAME }}
            FLASK_LOG_REQUESTS_FILENAME=${{ vars.FLASK_LOG_REQUESTS_FILENAME }}
            GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
            GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
