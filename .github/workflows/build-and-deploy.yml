name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-image.yml
    with:
      source-sha: ${{ github.sha }}
      target: production
    secrets:
      coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
      server-deploy-username: ${{ secrets.SERVER_DEPLOY_USERNAME }}
      server-deploy-ssh-private-key: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
      discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL_STATUS_ALERTS_PROD }}
