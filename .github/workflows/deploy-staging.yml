name: Deploy staging
run-name: Deploy staging from ${{ inputs.source-sha }}

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Full commit SHA to build from this repository
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: afp-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-image.yml
    with:
      source-sha: ${{ inputs.source-sha }}
      target: staging
    secrets:
      coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
      server-deploy-username: ${{ secrets.SERVER_DEPLOY_USERNAME }}
      server-deploy-ssh-private-key: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
      discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL_STATUS_ALERTS }}
